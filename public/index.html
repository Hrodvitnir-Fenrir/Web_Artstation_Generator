<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="author" content="Léo B.">
    <meta name="description" content="Générateur aléatoire d'artwork depuis ArtStation">
    <meta name="copyright" content="Léo B.">
    <meta name="theme-color" content="#0a0a0a">

    <meta property="og:title" content="ArtStation Generator">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Générateur aléatoire d'artwork depuis ArtStation">
    <meta property="og:url" content="https://larbreavin.ddns.net/Artstation_Random/">
    <meta property="og:locale" content="fr">
    <meta property="og:image" content="https://larbreavin.ddns.net/Artstation_Random/icon.png">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtStation Gallery</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>

<body>
    <header>
        <div class="header-inner">
            <div class="header-left">
                <img src="icon.png" class="icon" alt="logo">
                <div class="header-text">
                    <h1>GALLERY</h1>
                    <span class="subtitle">ArtStation · Découvertes aléatoires</span>
                </div>
            </div>
            <nav class="header-right">
                <a href="https://www.artstation.com/?sort_by=trending" class="nav-link" target="_blank">
                    artstation.com ↗
                </a>
                <div class="count-badge" id="countBadge">20 images</div>
            </nav>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <button class="btn-refresh" id="refreshAll" title="Nouvelles images">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Tout rafraîchir
            </button>

            <div class="grid-controls">
                <button class="grid-btn active" data-count="20" title="20 images">20</button>
                <button class="grid-btn" data-count="30" title="30 images">30</button>
                <button class="grid-btn" data-count="40" title="40 images">40</button>
            </div>
        </div>

        <div class="gallery" id="gallery"></div>
    </main>

    <div id="lightbox" class="lightbox" style="display:none">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <div class="lightbox-inner">
            <img id="lightboxImg" src="" alt="">
            <div class="lightbox-info">
                <p id="lightboxTitle"></p>
                <a id="lightboxLink" href="" target="_blank">Voir sur ArtStation ↗</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
